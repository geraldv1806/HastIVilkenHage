<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add / Change Horses</title>
  <style>
    /* Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Base */
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      background: #f9f9f9;
      color: #333;
      font-size: 18px;
      text-align: center;
    }
    header, footer {
      background-color: #003366;
      color: white;
      padding: 1.5rem;
    }
    main {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    h2 {
      font-size: 2rem;
      margin: 1.5rem 0;
    }

    /* Main add‐form fields all 300px wide */
    form#horse-form input,
    form#horse-form select {
      display: block;
      width: 300px;
      padding: 0.7rem;
      margin: 0.5rem auto;
      font-size: 1.1rem;
    }

    /* Buttons */
    button {
      background: #007BFF;
      border: none;
      color: #fff;
      padding: 0.8rem 1.5rem;
      margin: 0.7rem 0.5rem;
      cursor: pointer;
      border-radius: 4px;
      font-size: 1.1rem;
    }
    button:hover {
      background: #0056b3;
    }

    /* Editable‐horse list (Current Horses) */
    .edit-horse-form {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      margin-bottom: 1rem;
    }
    /* revert width so inputs/selects size naturally */
    .edit-horse-form input,
    .edit-horse-form select {
      width: auto;
      font-size: 1rem;
      margin: 0.5rem;
    }
    /* paddock input stays narrow */
    .edit-horse-form input[name="paddock"] {
      width: 50px;
    }
    /* mini-form buttons narrowed too */
    .edit-horse-form button {
      width: 80px;
      padding: 0.4rem;
      font-size: 1rem;
      margin: 0.5rem;
    }

    /* Navigation buttons */
    .nav-buttons {
      margin-top: 2rem;
    }
    .nav-buttons button {
      padding: 0.8rem 1.5rem;
      font-size: 1.1rem;
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      body {
        font-size: 16px;
      }
      h1 {
        font-size: 2rem;
      }
      h2 {
        font-size: 1.5rem;
      }
      form#horse-form input,
      form#horse-form select {
        width: 100%;
        max-width: none;
      }
      .edit-horse-form input[name="paddock"] {
        width: 40px;
      }
      .edit-horse-form button {
        width: 60px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>LÄGG TILL/ÄNDRA PÅ HÄSTAR</h1>
  </header>

  <main>
    <!-- your existing form -->
    <form id="horse-form">
      <input type="text" id="horse-name" placeholder="HÄSTNAMN" required/>
      <input type="number" id="paddock-number" placeholder="HAGNUMMER" required/>
      <select id="farm-select" required>
        <option value="" disabled selected>VÄLJ GÅRD…</option>
        <option value="Granliden">Granliden</option>
        <option value="Janstorp">Janstorp</option>
        <option value="Kämparp">Kämparp</option>
      </select>
      <button type="submit">LÄGG TILL</button>
    </form>

    <h2>AKTUELLA HÄSTAR</h2>
    <div id="horse-list"><!-- injected by script.js --></div>

    <!-- ← New navigation buttons → -->
    <div class="nav-buttons">
      <button onclick="location.href='index.html'">Home</button>
      <button onclick="location.href='granliden.html'">Granliden</button>
      <button onclick="location.href='janstorp.html'">Janstorp</button>
      <button onclick="location.href='kamparp.html'">Kämparp</button>
    </div>
  </main>

    &copy; 2025 Powered by Fox Från Stall Lövgren
  </footer>

</body>
