<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Granliden</title>
  <style>
    /* Reset */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Base */
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #333;
      font-size: 18px;
      text-align: center;
      line-height: 1.6;
    }
    header, footer {
      background-color: #003366;
      color: white;
      padding: 1.5rem;
    }
    main {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    h1 { font-size: 2.5rem; margin-bottom: 1rem; }

    /* Farm image */
    .farm-image {
      display: block;
      margin: 1.5rem auto;
      max-width: 40%;
      height: auto;
      border: 2px solid #ccc;
      border-radius: 8px;
    }

    /* Selector & paddock box */
    label {
      font-size: 1.2rem;
      margin-top: 1rem;
      display: block;
    }
    select#horse-select {
      padding: 0.7rem;
      font-size: 1.1rem;
      margin: 0.5rem auto;
      display: block;
      width: 200px;
    }
    .paddock-box {
      background: yellow;
      color: black;
      font-weight: bold;
      font-size: 3rem;
      text-align: center;
      padding: 1rem;
      border: 3px solid black;
      width: 100px;
      margin: 1.5rem auto;
      min-height: 3em;
      line-height: 1;
    }

    /* Nav buttons */
    .nav-buttons {
      margin-top: 2rem;
    }
    .nav-buttons button {
      background: #007BFF;
      border: none;
      color: white;
      padding: 0.8rem 1.5rem;
      margin: 0.5rem;
      font-size: 1.1rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .nav-buttons button:hover {
      background: #0056b3;
    }

    /* Responsive */
    @media (max-width: 600px) {
      body { font-size: 16px; }
      h1 { font-size: 2rem; }
      select#horse-select { width: 150px; }
      .paddock-box {
        width: 80px;
        font-size: 2rem;
      }
      .farm-image { max-width: 50%; }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="farm-name">Janstorp</h1>
  </header>

  <main>
    <p>Välj en häst från Janstorp:</p>
    
     <main>
    <!-- Farm image -->
    <img src="janstorphagar.jpg" alt="Janstorp hagar" class="farm-image"/>

    <label for="horse-select">HÄST:</label>
    <select id="horse-select">
      <!-- options injected by script.js -->
    </select>

    <div class="paddock-box" id="paddock-display"></div>

    <div class="nav-buttons">
      <button onclick="location.href='index.html'">Home</button>
      <button onclick="location.href='add.html'">Add / Change Horses</button>
    </div>
  </main>

  <footer>
    &copy; 2025 My Static Site
   </footer>

    import { getFirestore  } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";
    const firebaseConfig = {
      apiKey: "AIzaSyDdXEdZu9u5LVxPaz0OCGlo9dQY8_EUmrc",
      authDomain: "hagar-stall-lovgren.firebaseapp.com",
      projectId: "hagar-stall-lovgren",
      storageBucket: "hagar-stall-lovgren.firebasestorage.app",
      messagingSenderId: "509689885034",
      appId: "1:509689885034:web:406f889152fe2d32197513",
      measurementId: "G-BNR6MDYBZS"

    const app = initializeApp(firebaseConfig);
    export const db = getFirestore(app);
  </script>

  <!-- Your application logic -->
  <script type="module" src="script.js"></script>
</body>
</html>
